<!DOCTYPE html>
<html>
<head>
  <title>AuthorCart</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: black;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }
    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
    }
    button {
      background: orange;
      border: none;
      padding: 8px;
      width: 100%;
      color: white;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>🛒 AuthorCart</header>

<div id="cart" style="padding:10px; background:white; margin:10px; border-radius:10px;">
  <h3>🛒 Cart</h3>
  <ul id="cart-items"></ul>
  <p id="total">Total: ₦0</p>
</div>

<div class="products">

  <div class="card">
    <h3>Product 1</h3>
    <p>₦5,000</p>
    <button onclick="addToCart('Product 1', 5000)">Add to Cart</button>
  </div>

  <div class="card">
    <h3>Product 2</h3>
    <p>₦10,000</p>
    <button onclick="addToCart('Product 2', 10000)">Add to Cart</button>
  </div>

</div>

<script>
let cart = [];

function addToCart(product, price) {
  cart.push({ product, price });
  updateCart();
}

function updateCart() {
  let cartList = document.getElementById("cart-items");
  cartList.innerHTML = "";

  cart.forEach(item => {
    let li = document.createElement("li");
    li.textContent = item.product + " - ₦" + item.price;
    cartList.appendChild(li);
  });
}
</script>

</body>
</html>
